<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none" role="img" aria-label="NGINX proxy_cache_bypass: conditionally skip cache on fetch but still refill it with the fresh response">
  <rect width="1200" height="630" fill="#fbfaf7"/>

  <g>
    <rect x="0" y="0" width="1200" height="36" fill="#eeeae3"/>
    <circle cx="18" cy="18" r="5.5" fill="#ff5f56"/>
    <circle cx="36" cy="18" r="5.5" fill="#ffbd2e"/>
    <circle cx="54" cy="18" r="5.5" fill="#27c93f"/>
    <line x1="0" y1="36" x2="1200" y2="36" stroke="#4c4f69" stroke-width="0.5" opacity="0.12"/>
  </g>

  <!-- Two request paths stacked -->
  <!-- Normal request (green) -->
  <g transform="translate(80 150)">
    <rect width="160" height="54" rx="10" fill="#40a02b"/>
    <text x="80" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#fbfaf7" text-anchor="middle" font-weight="600">normal req</text>
  </g>
  <text x="160" y="227" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#4c4f69" text-anchor="middle" opacity="0.55" letter-spacing="0.1em">$office_networks = 0</text>

  <!-- Bypass request (peach) -->
  <g transform="translate(80 420)">
    <rect width="160" height="54" rx="10" fill="#fe640b"/>
    <text x="80" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#fbfaf7" text-anchor="middle" font-weight="600">office req</text>
  </g>
  <text x="160" y="497" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#4c4f69" text-anchor="middle" opacity="0.55" letter-spacing="0.1em">$office_networks = 1</text>

  <!-- Arrows to NGINX -->
  <g stroke="#4c4f69" fill="#4c4f69" stroke-width="2.5">
    <line x1="245" y1="175" x2="400" y2="240"/>
    <polygon points="410,243 397,245 400,231"/>
    <line x1="245" y1="447" x2="400" y2="382"/>
    <polygon points="410,379 400,391 397,377"/>
  </g>

  <!-- NGINX config block (peach) -->
  <g transform="translate(415 210)">
    <rect width="300" height="200" rx="12" fill="#fe640b"/>
    <text x="150" y="34" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#fbfaf7" text-anchor="middle" opacity="0.7" letter-spacing="0.12em">NGINX LOCATION /</text>
    <line x1="24" y1="50" x2="276" y2="50" stroke="#fbfaf7" stroke-width="1" opacity="0.25"/>
    <text x="24" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#fbfaf7" font-weight="600">proxy_cache_bypass</text>
    <text x="24" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#fbfaf7">  $office_networks;</text>
    <text x="24" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#fbfaf7" opacity="0.85">proxy_cache mycache;</text>
    <text x="24" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#fbfaf7" opacity="0.85">proxy_cache_valid any 5m;</text>
    <text x="24" y="178" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#fbfaf7" opacity="0.7">bypass on read · still eligible on write</text>
  </g>

  <!-- Divergent behavior: normal → HIT (green), office → skip+refill (peach) -->
  <g stroke="#40a02b" fill="#40a02b" stroke-width="2.5">
    <line x1="720" y1="255" x2="820" y2="215"/>
    <polygon points="826,212 815,218 813,204"/>
  </g>
  <text x="775" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#40a02b" font-weight="600" stroke="#fbfaf7" stroke-width="4" paint-order="stroke">read cache</text>

  <g stroke="#fe640b" fill="#fe640b" stroke-width="2.5">
    <line x1="720" y1="355" x2="820" y2="395"/>
    <polygon points="826,398 813,401 815,387"/>
  </g>
  <text x="775" y="375" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#fe640b" font-weight="600" stroke="#fbfaf7" stroke-width="4" paint-order="stroke">skip cache</text>

  <!-- Cache cylinder -->
  <g transform="translate(820 190)">
    <ellipse cx="65" cy="15" rx="65" ry="13" fill="#4c4f69"/>
    <rect x="0" y="15" width="130" height="60" fill="#4c4f69"/>
    <ellipse cx="65" cy="75" rx="65" ry="13" fill="#4c4f69"/>
    <text x="65" y="52" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#fbfaf7" text-anchor="middle">cache</text>
  </g>

  <!-- Backend -->
  <g transform="translate(840 380)">
    <rect width="130" height="70" rx="10" stroke="#4c4f69" stroke-width="2.5"/>
    <text x="65" y="42" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#4c4f69" text-anchor="middle">backend</text>
  </g>

  <!-- Arrow cache ← backend refill (peach dashed) -->
  <g stroke="#fe640b" fill="#fe640b" stroke-width="2" stroke-dasharray="4 4">
    <line x1="885" y1="380" x2="885" y2="280"/>
    <polygon points="885,272 878,286 892,286"/>
  </g>
  <text x="990" y="340" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#fe640b" font-weight="600" stroke="#fbfaf7" stroke-width="4" paint-order="stroke">refill on</text>
  <text x="990" y="356" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#fe640b" font-weight="600" stroke="#fbfaf7" stroke-width="4" paint-order="stroke">response</text>

  <text x="1178" y="618" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#4c4f69" text-anchor="end" opacity="0.35">// syshero.org</text>
</svg>

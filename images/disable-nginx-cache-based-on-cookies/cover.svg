<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none" role="img" aria-label="Disable NGINX cache based on cookies via map and proxy_no_cache">
  <rect width="1200" height="630" fill="#fbfaf7"/>

  <g>
    <rect x="0" y="0" width="1200" height="36" fill="#eeeae3"/>
    <circle cx="18" cy="18" r="5.5" fill="#ff5f56"/>
    <circle cx="36" cy="18" r="5.5" fill="#ffbd2e"/>
    <circle cx="54" cy="18" r="5.5" fill="#27c93f"/>
    <line x1="0" y1="36" x2="1200" y2="36" stroke="#4c4f69" stroke-width="0.5" opacity="0.12"/>
  </g>

  <!-- Two requests stacked: anonymous and logged-in -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <!-- Anonymous request (no auth cookie) -->
    <g transform="translate(80 155)">
      <rect width="260" height="110" rx="10" stroke="#4c4f69" stroke-width="2.5"/>
      <text x="20" y="30" font-size="13" fill="#4c4f69" opacity="0.55">anonymous request</text>
      <line x1="20" y1="42" x2="240" y2="42" stroke="#4c4f69" stroke-width="1" opacity="0.18"/>
      <text x="20" y="66" font-size="14" fill="#4c4f69" opacity="0.85">Cookie:</text>
      <text x="20" y="88" font-size="13" fill="#4c4f69" opacity="0.4">(no ASPXAUTH)</text>
    </g>
    <!-- Logged-in request (has auth cookie) -->
    <g transform="translate(80 395)">
      <rect width="260" height="110" rx="10" stroke="#4c4f69" stroke-width="2.5"/>
      <text x="20" y="30" font-size="13" fill="#4c4f69" opacity="0.55">logged-in request</text>
      <line x1="20" y1="42" x2="240" y2="42" stroke="#4c4f69" stroke-width="1" opacity="0.18"/>
      <text x="20" y="66" font-size="14" fill="#4c4f69" opacity="0.85">Cookie:</text>
      <rect x="20" y="76" width="220" height="24" rx="4" fill="#fe640b"/>
      <text x="30" y="93" font-size="12" fill="#fbfaf7" font-weight="600">ASPXAUTH=abc...</text>
    </g>
  </g>

  <!-- Map box in the middle -->
  <g transform="translate(410 240)">
    <rect width="320" height="150" rx="12" fill="#fe640b"/>
    <text x="160" y="34" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#fbfaf7" text-anchor="middle" opacity="0.7" letter-spacing="0.12em">NGINX MAP</text>
    <text x="20" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#fbfaf7">map $http_cookie</text>
    <text x="20" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#fbfaf7">          $no_cache</text>
    <line x1="20" y1="102" x2="300" y2="102" stroke="#fbfaf7" stroke-width="1" opacity="0.25"/>
    <text x="20" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#fbfaf7" opacity="0.85">default → 0</text>
    <text x="20" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#fbfaf7" opacity="0.85">~ASPXAUTH → 1</text>
  </g>

  <!-- Arrows from both requests to map -->
  <g stroke="#4c4f69" fill="#4c4f69" stroke-width="2.5">
    <line x1="343" y1="210" x2="410" y2="280"/>
    <line x1="343" y1="450" x2="410" y2="360"/>
  </g>

  <!-- Decision: 0 → cache (green), 1 → no_cache (peach) -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <!-- branch to cache -->
    <g stroke="#40a02b" fill="#40a02b" stroke-width="2.5">
      <line x1="735" y1="280" x2="860" y2="200"/>
      <polygon points="866,196 856,203 853,189"/>
    </g>
    <!-- ink label placed above the arrow path, with white halo via paint-order for legibility -->
    <text x="760" y="248" font-size="13" fill="#4c4f69" opacity="0.85"
          stroke="#fbfaf7" stroke-width="4" paint-order="stroke">$no_cache = 0</text>
    <g transform="translate(870 175)">
      <rect width="170" height="60" rx="10" fill="#40a02b"/>
      <text x="85" y="38" font-size="17" fill="#fbfaf7" text-anchor="middle" font-weight="600">CACHE</text>
    </g>

    <!-- branch to no-cache -->
    <g stroke="#fe640b" fill="#fe640b" stroke-width="2.5">
      <line x1="735" y1="355" x2="860" y2="435"/>
      <polygon points="866,439 853,446 856,432"/>
    </g>
    <text x="760" y="402" font-size="13" fill="#4c4f69" opacity="0.85"
          stroke="#fbfaf7" stroke-width="4" paint-order="stroke">$no_cache = 1</text>
    <g transform="translate(870 415)">
      <rect width="170" height="60" rx="10" stroke="#fe640b" stroke-width="2.5"/>
      <text x="85" y="38" font-size="15" fill="#fe640b" text-anchor="middle" font-weight="600">BYPASS</text>
    </g>
  </g>

  <!-- proxy_no_cache hint at bottom -->
  <text x="600" y="550" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#4c4f69" text-anchor="middle" opacity="0.55">proxy_no_cache $no_cache;</text>

  <!-- Corner wordmark -->
  <text x="1178" y="618" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#4c4f69" text-anchor="end" opacity="0.35">// syshero.org</text>
</svg>

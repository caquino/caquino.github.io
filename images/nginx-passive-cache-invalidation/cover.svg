<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none" role="img" aria-label="NGINX passive cache invalidation: backend returns X-Expire-Content header, Lua queues URI, next request bypasses">
  <rect width="1200" height="630" fill="#fbfaf7"/>

  <g>
    <rect x="0" y="0" width="1200" height="36" fill="#eeeae3"/>
    <circle cx="18" cy="18" r="5.5" fill="#ff5f56"/>
    <circle cx="36" cy="18" r="5.5" fill="#ffbd2e"/>
    <circle cx="54" cy="18" r="5.5" fill="#27c93f"/>
    <line x1="0" y1="36" x2="1200" y2="36" stroke="#4c4f69" stroke-width="0.5" opacity="0.12"/>
  </g>

  <!-- Step label -->
  <text x="240" y="75" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#4c4f69" text-anchor="middle" opacity="0.55" letter-spacing="0.15em">STEP 1 · BACKEND MARKS URI EXPIRED</text>
  <text x="900" y="75" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#4c4f69" text-anchor="middle" opacity="0.55" letter-spacing="0.15em">STEP 2 · NEXT REQUEST TRIGGERS BYPASS</text>

  <!-- LEFT: backend response with X-Expire-Content header -->
  <g transform="translate(80 105)">
    <rect width="180" height="80" rx="10" stroke="#4c4f69" stroke-width="2.5"/>
    <text x="90" y="32" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#4c4f69" text-anchor="middle" opacity="0.6">backend</text>
    <text x="90" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#4c4f69" text-anchor="middle">response</text>
  </g>

  <g stroke="#4c4f69" fill="#4c4f69" stroke-width="2.5">
    <line x1="260" y1="145" x2="305" y2="145"/>
    <polygon points="315,145 303,138 303,152"/>
  </g>

  <!-- NGINX header_filter_by_lua reads header → adds to queue -->
  <g transform="translate(320 100)">
    <rect width="180" height="90" rx="10" stroke="#4c4f69" stroke-width="2.5"/>
    <text x="90" y="26" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#4c4f69" text-anchor="middle" opacity="0.55" letter-spacing="0.1em">NGINX LUA</text>
    <text x="90" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#4c4f69" text-anchor="middle" opacity="0.85">header_filter</text>
    <text x="90" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#4c4f69" text-anchor="middle" opacity="0.85">_by_lua</text>
  </g>

  <!-- Highlighted header extracted from backend response -->
  <g transform="translate(80 220)">
    <rect width="440" height="60" rx="8" fill="#fe640b" opacity="0.18"/>
    <rect width="440" height="60" rx="8" stroke="#fe640b" stroke-width="2" stroke-dasharray="4 3" opacity="0.6"/>
    <text x="20" y="25" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#fe640b" opacity="0.8" letter-spacing="0.1em">BACKEND RESPONSE HEADER</text>
    <text x="20" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#fe640b" font-weight="600">X-Expire-Content: /random</text>
  </g>

  <!-- Shared dict (queue) -->
  <g transform="translate(150 340)">
    <rect width="320" height="140" rx="12" fill="#fe640b"/>
    <text x="160" y="34" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#fbfaf7" text-anchor="middle" opacity="0.7" letter-spacing="0.12em">LUA SHARED DICT</text>
    <text x="160" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#fbfaf7" text-anchor="middle" opacity="0.85">expire_queue</text>
    <line x1="24" y1="74" x2="296" y2="74" stroke="#fbfaf7" stroke-width="1" opacity="0.25"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#fbfaf7">
      <text x="28" y="100">• /random → 1</text>
      <text x="28" y="120">• /homepage → 1</text>
    </g>
  </g>

  <!-- Downward arrow to queue -->
  <g stroke="#fe640b" fill="#fe640b" stroke-width="2" opacity="0.85">
    <line x1="300" y1="285" x2="300" y2="335"/>
    <polygon points="300,342 293,329 307,329"/>
  </g>

  <!-- Divider -->
  <line x1="600" y1="90" x2="600" y2="540" stroke="#4c4f69" stroke-width="1" opacity="0.15" stroke-dasharray="4 4"/>

  <!-- RIGHT: next request arrives for /random -->
  <g transform="translate(650 105)">
    <rect width="200" height="80" rx="10" stroke="#4c4f69" stroke-width="2.5"/>
    <text x="100" y="30" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#4c4f69" text-anchor="middle" opacity="0.6">client request</text>
    <text x="100" y="55" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#4c4f69" text-anchor="middle">GET /random</text>
  </g>

  <g stroke="#4c4f69" fill="#4c4f69" stroke-width="2.5">
    <line x1="850" y1="145" x2="895" y2="145"/>
    <polygon points="905,145 893,138 893,152"/>
  </g>

  <!-- set_by_lua checks queue -->
  <g transform="translate(910 100)">
    <rect width="200" height="90" rx="10" stroke="#4c4f69" stroke-width="2.5"/>
    <text x="100" y="26" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#4c4f69" text-anchor="middle" opacity="0.55" letter-spacing="0.1em">NGINX LUA</text>
    <text x="100" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#4c4f69" text-anchor="middle" opacity="0.85">set_by_lua</text>
    <text x="100" y="70" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#4c4f69" text-anchor="middle" opacity="0.85">$http_cache_purge</text>
  </g>

  <!-- Queue lookup arrow -->
  <g stroke="#fe640b" fill="#fe640b" stroke-width="2" stroke-dasharray="4 3" opacity="0.85">
    <line x1="920" y1="195" x2="470" y2="405"/>
    <polygon points="465,408 479,406 473,420" fill="#fe640b" opacity="0.85"/>
  </g>
  <text x="755" y="295" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#fe640b" text-anchor="middle" opacity="0.9" stroke="#fbfaf7" stroke-width="4" paint-order="stroke">lookup + delete</text>

  <!-- proxy_cache_bypass outcome -->
  <g transform="translate(720 380)">
    <rect width="380" height="100" rx="10" fill="#40a02b" opacity="0.15"/>
    <rect width="380" height="100" rx="10" stroke="#40a02b" stroke-width="2.5"/>
    <text x="190" y="30" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#40a02b" text-anchor="middle" opacity="0.75" letter-spacing="0.12em">PROXY_CACHE_BYPASS</text>
    <text x="190" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#40a02b" text-anchor="middle" font-weight="600">X-Cached: BYPASS</text>
    <text x="190" y="82" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#40a02b" text-anchor="middle" opacity="0.8">refetched from backend, cache refilled</text>
  </g>

  <text x="1178" y="618" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#4c4f69" text-anchor="end" opacity="0.35">// syshero.org</text>
</svg>

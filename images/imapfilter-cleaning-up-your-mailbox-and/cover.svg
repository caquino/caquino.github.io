<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none" role="img" aria-label="imapfilter: Lua rules consume the INBOX and route messages to archive, trash, or cleanup folders">
  <rect width="1200" height="630" fill="#fbfaf7"/>

  <g>
    <rect x="0" y="0" width="1200" height="36" fill="#eeeae3"/>
    <circle cx="18" cy="18" r="5.5" fill="#ff5f56"/>
    <circle cx="36" cy="18" r="5.5" fill="#ffbd2e"/>
    <circle cx="54" cy="18" r="5.5" fill="#27c93f"/>
    <line x1="0" y1="36" x2="1200" y2="36" stroke="#4c4f69" stroke-width="0.5" opacity="0.12"/>
  </g>

  <!-- INBOX on left -->
  <g transform="translate(90 180)">
    <rect width="220" height="280" rx="12" stroke="#4c4f69" stroke-width="3"/>
    <text x="110" y="34" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#4c4f69" text-anchor="middle" opacity="0.55" letter-spacing="0.12em">INBOX</text>
    <line x1="20" y1="50" x2="200" y2="50" stroke="#4c4f69" stroke-width="1" opacity="0.18"/>
    <!-- Message envelopes -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <g transform="translate(16 66)">
        <rect width="188" height="30" rx="4" fill="#4c4f69" opacity="0.08"/>
        <text x="12" y="20" fill="#4c4f69" opacity="0.85">seen · 45d old</text>
      </g>
      <g transform="translate(16 102)">
        <rect width="188" height="30" rx="4" fill="#4c4f69" opacity="0.08"/>
        <text x="12" y="20" fill="#4c4f69" opacity="0.85">calendar · 120d</text>
      </g>
      <g transform="translate(16 138)">
        <rect width="188" height="30" rx="4" fill="#4c4f69" opacity="0.08"/>
        <text x="12" y="20" fill="#4c4f69" opacity="0.85">from: spammer@…</text>
      </g>
      <g transform="translate(16 174)">
        <rect width="188" height="30" rx="4" fill="#4c4f69" opacity="0.08"/>
        <text x="12" y="20" fill="#4c4f69" opacity="0.85">subject: AFK</text>
      </g>
      <g transform="translate(16 210)">
        <rect width="188" height="30" rx="4" fill="#4c4f69" opacity="0.08"/>
        <text x="12" y="20" fill="#4c4f69" opacity="0.85">unseen · 3d old</text>
      </g>
    </g>
    <text x="110" y="265" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#4c4f69" text-anchor="middle" opacity="0.5">(and a few thousand more)</text>
  </g>

  <!-- Arrow → Lua rules -->
  <g stroke="#4c4f69" fill="#4c4f69" stroke-width="2.5">
    <line x1="315" y1="320" x2="385" y2="320"/>
    <polygon points="395,320 383,313 383,327"/>
  </g>

  <!-- imapfilter Lua rules (peach) -->
  <g transform="translate(400 200)">
    <rect width="340" height="240" rx="12" fill="#fe640b"/>
    <text x="170" y="34" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#fbfaf7" text-anchor="middle" opacity="0.7" letter-spacing="0.12em">IMAPFILTER · config.lua</text>
    <line x1="24" y1="50" x2="316" y2="50" stroke="#fbfaf7" stroke-width="1" opacity="0.25"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#fbfaf7">
      <text x="24" y="78">:is_seen() * :is_older(30)</text>
      <text x="24" y="98" opacity="0.75">  → archive</text>
      <text x="24" y="128">:contain_from(senders)</text>
      <text x="24" y="148" opacity="0.75">  → trash</text>
      <text x="24" y="178">:contain_subject(subjects)</text>
      <text x="24" y="198" opacity="0.75">  → trash</text>
      <text x="24" y="226">:is_older(90) [INBOX]</text>
    </g>
  </g>

  <!-- Three destination folders on right -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
    <!-- Archive (green) -->
    <g transform="translate(810 165)">
      <rect width="290" height="90" rx="10" fill="#40a02b"/>
      <text x="145" y="30" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#fbfaf7" text-anchor="middle" opacity="0.75" letter-spacing="0.12em">ARCHIVE</text>
      <text x="145" y="58" fill="#fbfaf7" text-anchor="middle" font-weight="600">[Gmail]/All Mail</text>
      <text x="145" y="76" fill="#fbfaf7" text-anchor="middle" opacity="0.85" font-size="11">keep, just not in INBOX</text>
    </g>

    <!-- Trash (primary peach-ish, use ink to avoid palette clash — use peach) -->
    <g transform="translate(810 280)">
      <rect width="290" height="90" rx="10" stroke="#4c4f69" stroke-width="2.5"/>
      <text x="145" y="30" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#4c4f69" text-anchor="middle" opacity="0.6" letter-spacing="0.12em">TRASH</text>
      <text x="145" y="58" fill="#4c4f69" text-anchor="middle" font-weight="600">[Gmail]/Trash</text>
      <text x="145" y="76" fill="#4c4f69" text-anchor="middle" opacity="0.75" font-size="11">then expunge</text>
    </g>

    <!-- Cleanup (blue) -->
    <g transform="translate(810 395)">
      <rect width="290" height="90" rx="10" fill="#1e66f5"/>
      <text x="145" y="30" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#fbfaf7" text-anchor="middle" opacity="0.75" letter-spacing="0.12em">CLEANUP</text>
      <text x="145" y="58" fill="#fbfaf7" text-anchor="middle" font-weight="600">Cleanup</text>
      <text x="145" y="76" fill="#fbfaf7" text-anchor="middle" opacity="0.85" font-size="11">older INBOX parking spot</text>
    </g>
  </g>

  <!-- Routing arrows -->
  <g stroke="#4c4f69" fill="#4c4f69" stroke-width="2.5">
    <line x1="745" y1="250" x2="800" y2="210"/>
    <polygon points="807,205 796,211 794,197"/>
    <line x1="745" y1="320" x2="800" y2="325"/>
    <polygon points="810,325 798,318 798,332"/>
    <line x1="745" y1="390" x2="800" y2="440"/>
    <polygon points="807,445 794,447 796,433"/>
  </g>

  <text x="1178" y="618" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#4c4f69" text-anchor="end" opacity="0.35">// syshero.org</text>
</svg>

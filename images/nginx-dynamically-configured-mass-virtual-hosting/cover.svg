<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none" role="img" aria-label="NGINX mass virtual hosting: regex server_name captures $domain, drives root and access_log paths">
  <rect width="1200" height="630" fill="#fbfaf7"/>

  <g>
    <rect x="0" y="0" width="1200" height="36" fill="#eeeae3"/>
    <circle cx="18" cy="18" r="5.5" fill="#ff5f56"/>
    <circle cx="36" cy="18" r="5.5" fill="#ffbd2e"/>
    <circle cx="54" cy="18" r="5.5" fill="#27c93f"/>
    <line x1="0" y1="36" x2="1200" y2="36" stroke="#4c4f69" stroke-width="0.5" opacity="0.12"/>
  </g>

  <!-- Multiple incoming hosts stacked on left -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
    <g transform="translate(90 150)">
      <rect width="210" height="42" rx="8" stroke="#4c4f69" stroke-width="2"/>
      <text x="20" y="27" fill="#4c4f69">Host: alice.com</text>
    </g>
    <g transform="translate(90 205)">
      <rect width="210" height="42" rx="8" stroke="#4c4f69" stroke-width="2"/>
      <text x="20" y="27" fill="#4c4f69">Host: bob.net</text>
    </g>
    <g transform="translate(90 260)">
      <rect width="210" height="42" rx="8" stroke="#4c4f69" stroke-width="2"/>
      <text x="20" y="27" fill="#4c4f69">Host: carol.io</text>
    </g>
    <g transform="translate(90 315)">
      <rect width="210" height="42" rx="8" stroke="#4c4f69" stroke-width="2"/>
      <text x="20" y="27" fill="#4c4f69">Host: dave.dev</text>
    </g>
    <text x="195" y="392" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#4c4f69" text-anchor="middle" opacity="0.55">+ N more domains</text>
  </g>

  <!-- Arrows converging on the single server block -->
  <g stroke="#4c4f69" fill="#4c4f69" stroke-width="2" opacity="0.5">
    <line x1="300" y1="170" x2="405" y2="265"/>
    <line x1="300" y1="225" x2="405" y2="280"/>
    <line x1="300" y1="280" x2="405" y2="290"/>
    <line x1="300" y1="335" x2="405" y2="305"/>
  </g>

  <!-- Regex server_name capture (peach) -->
  <g transform="translate(410 180)">
    <rect width="380" height="190" rx="12" fill="#fe640b"/>
    <text x="190" y="34" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#fbfaf7" text-anchor="middle" opacity="0.7" letter-spacing="0.12em">SINGLE SERVER BLOCK</text>
    <line x1="24" y1="50" x2="356" y2="50" stroke="#fbfaf7" stroke-width="1" opacity="0.25"/>
    <text x="24" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#fbfaf7" opacity="0.9">server_name</text>
    <text x="24" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#fbfaf7" font-weight="600">  ~^(www\.)?(?&lt;domain&gt;.+)$;</text>
    <text x="24" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#fbfaf7" opacity="0.9">root       /srv/httpd/<tspan font-weight="600">$domain</tspan>/public_html;</text>
    <text x="24" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#fbfaf7" opacity="0.9">access_log /srv/httpd/<tspan font-weight="600">$domain</tspan>/logs/access.log;</text>
  </g>

  <!-- Arrow to filesystem tree -->
  <g stroke="#4c4f69" fill="#4c4f69" stroke-width="2.5">
    <line x1="795" y1="275" x2="855" y2="275"/>
    <polygon points="865,275 853,268 853,282"/>
  </g>

  <!-- Filesystem tree on right -->
  <g transform="translate(870 150)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
    <rect width="260" height="280" rx="12" stroke="#4c4f69" stroke-width="2.5"/>
    <text x="130" y="30" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#4c4f69" text-anchor="middle" opacity="0.55" letter-spacing="0.12em">FILESYSTEM</text>
    <line x1="20" y1="46" x2="240" y2="46" stroke="#4c4f69" stroke-width="1" opacity="0.18"/>
    <g fill="#4c4f69" opacity="0.85">
      <text x="20" y="72">/srv/httpd/</text>
      <text x="36" y="96">├── alice.com/</text>
      <text x="56" y="116" opacity="0.6">├── public_html/</text>
      <text x="56" y="134" opacity="0.6">└── logs/</text>
      <text x="36" y="158">├── bob.net/</text>
      <text x="36" y="180">├── carol.io/</text>
      <text x="36" y="202">├── dave.dev/</text>
      <text x="36" y="224" opacity="0.5">└── …</text>
    </g>
  </g>

  <text x="1178" y="618" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#4c4f69" text-anchor="end" opacity="0.35">// syshero.org</text>
</svg>

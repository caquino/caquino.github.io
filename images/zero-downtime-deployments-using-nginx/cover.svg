<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none" role="img" aria-label="Zero-downtime deploy: flip the 'down' flag between two upstream servers and nginx -s reload">
  <rect width="1200" height="630" fill="#fbfaf7"/>

  <g>
    <rect x="0" y="0" width="1200" height="36" fill="#eeeae3"/>
    <circle cx="18" cy="18" r="5.5" fill="#ff5f56"/>
    <circle cx="36" cy="18" r="5.5" fill="#ffbd2e"/>
    <circle cx="54" cy="18" r="5.5" fill="#27c93f"/>
    <line x1="0" y1="36" x2="1200" y2="36" stroke="#4c4f69" stroke-width="0.5" opacity="0.12"/>
  </g>

  <!-- BEFORE -->
  <text x="300" y="85" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#4c4f69" text-anchor="middle" opacity="0.55" letter-spacing="0.12em">BEFORE DEPLOY</text>
  <g transform="translate(90 110)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
    <rect width="420" height="240" rx="12" stroke="#4c4f69" stroke-width="2.5"/>
    <text x="20" y="34" fill="#4c4f69" font-weight="600">upstream zerodowntime {</text>
    <g transform="translate(36 54)">
      <rect width="360" height="50" rx="6" fill="#40a02b" opacity="0.15"/>
      <rect width="360" height="50" rx="6" stroke="#40a02b" stroke-width="2"/>
      <text x="16" y="30" fill="#40a02b" font-weight="600">server 127.0.0.1:8001;</text>
      <text x="220" y="30" fill="#40a02b" opacity="0.8">← active (v1)</text>
    </g>
    <g transform="translate(36 118)">
      <rect width="360" height="50" rx="6" fill="#4c4f69" opacity="0.08"/>
      <rect width="360" height="50" rx="6" stroke="#4c4f69" stroke-width="2" opacity="0.45"/>
      <text x="16" y="30" fill="#4c4f69" opacity="0.7" font-weight="600">server 127.0.0.1:8002 down;</text>
      <text x="260" y="30" fill="#4c4f69" opacity="0.55">← parked</text>
    </g>
    <text x="20" y="200" fill="#4c4f69" font-weight="600">}</text>
  </g>

  <!-- Switch step (peach) -->
  <g transform="translate(520 225)">
    <rect width="170" height="90" rx="12" fill="#fe640b"/>
    <text x="85" y="34" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#fbfaf7" text-anchor="middle" opacity="0.7" letter-spacing="0.12em">SWITCH</text>
    <text x="85" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#fbfaf7" text-anchor="middle" font-weight="600">sed + reload</text>
    <text x="85" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#fbfaf7" text-anchor="middle" opacity="0.9">flip "down" flag</text>
  </g>

  <!-- Arrows -->
  <g stroke="#fe640b" fill="#fe640b" stroke-width="3">
    <line x1="515" y1="265" x2="540" y2="265"/>
    <polygon points="522,265 510,258 510,272"/>
    <line x1="690" y1="265" x2="710" y2="265"/>
    <polygon points="720,265 708,258 708,272"/>
  </g>

  <!-- AFTER -->
  <text x="930" y="85" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#4c4f69" text-anchor="middle" opacity="0.55" letter-spacing="0.12em">AFTER DEPLOY</text>
  <g transform="translate(720 110)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
    <rect width="420" height="240" rx="12" stroke="#4c4f69" stroke-width="2.5"/>
    <text x="20" y="34" fill="#4c4f69" font-weight="600">upstream zerodowntime {</text>
    <g transform="translate(36 54)">
      <rect width="360" height="50" rx="6" fill="#4c4f69" opacity="0.08"/>
      <rect width="360" height="50" rx="6" stroke="#4c4f69" stroke-width="2" opacity="0.45"/>
      <text x="16" y="30" fill="#4c4f69" opacity="0.7" font-weight="600">server 127.0.0.1:8001 down;</text>
      <text x="260" y="30" fill="#4c4f69" opacity="0.55">← draining</text>
    </g>
    <g transform="translate(36 118)">
      <rect width="360" height="50" rx="6" fill="#40a02b" opacity="0.15"/>
      <rect width="360" height="50" rx="6" stroke="#40a02b" stroke-width="2"/>
      <text x="16" y="30" fill="#40a02b" font-weight="600">server 127.0.0.1:8002;</text>
      <text x="220" y="30" fill="#40a02b" opacity="0.8">← active (v2)</text>
    </g>
    <text x="20" y="200" fill="#4c4f69" font-weight="600">}</text>
  </g>

  <!-- Signal -->
  <g transform="translate(440 460)">
    <rect width="320" height="70" rx="10" fill="#fe640b" opacity="0.15"/>
    <rect width="320" height="70" rx="10" stroke="#fe640b" stroke-width="2.5"/>
    <text x="160" y="28" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#fe640b" text-anchor="middle" opacity="0.75" letter-spacing="0.12em">SIGNAL</text>
    <text x="160" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#fe640b" text-anchor="middle" font-weight="600">nginx -s reload</text>
  </g>
  <text x="600" y="550" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#4c4f69" text-anchor="middle" opacity="0.6">in-flight requests drain on 8001 · new requests land on 8002</text>

  <text x="1178" y="618" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#4c4f69" text-anchor="end" opacity="0.35">// syshero.org</text>
</svg>

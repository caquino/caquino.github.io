<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none" role="img" aria-label="NGINX as a keepalive proxy: non-persistent local connections multiplexed onto persistent upstream pool">
  <rect width="1200" height="630" fill="#fbfaf7"/>

  <g>
    <rect x="0" y="0" width="1200" height="36" fill="#eeeae3"/>
    <circle cx="18" cy="18" r="5.5" fill="#ff5f56"/>
    <circle cx="36" cy="18" r="5.5" fill="#ffbd2e"/>
    <circle cx="54" cy="18" r="5.5" fill="#27c93f"/>
    <line x1="0" y1="36" x2="1200" y2="36" stroke="#4c4f69" stroke-width="0.5" opacity="0.12"/>
  </g>

  <!-- PHP app on the left (multiple short-lived requests) -->
  <g transform="translate(100 170)">
    <rect width="200" height="290" rx="12" stroke="#4c4f69" stroke-width="3"/>
    <text x="100" y="36" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#4c4f69" text-anchor="middle" opacity="0.55" letter-spacing="0.12em">PHP APP</text>
    <line x1="20" y1="52" x2="180" y2="52" stroke="#4c4f69" stroke-width="1" opacity="0.18"/>
    <!-- Stack of short-lived request boxes -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <g transform="translate(20 68)">
        <rect width="160" height="28" rx="4" fill="#4c4f69" opacity="0.1"/>
        <text x="14" y="19" fill="#4c4f69">req #1 · new TCP</text>
      </g>
      <g transform="translate(20 102)">
        <rect width="160" height="28" rx="4" fill="#4c4f69" opacity="0.1"/>
        <text x="14" y="19" fill="#4c4f69">req #2 · new TCP</text>
      </g>
      <g transform="translate(20 136)">
        <rect width="160" height="28" rx="4" fill="#4c4f69" opacity="0.1"/>
        <text x="14" y="19" fill="#4c4f69">req #3 · new TCP</text>
      </g>
      <g transform="translate(20 170)">
        <rect width="160" height="28" rx="4" fill="#4c4f69" opacity="0.1"/>
        <text x="14" y="19" fill="#4c4f69">req #4 · new TCP</text>
      </g>
      <g transform="translate(20 204)">
        <rect width="160" height="28" rx="4" fill="#4c4f69" opacity="0.1"/>
        <text x="14" y="19" fill="#4c4f69">req #5 · new TCP</text>
      </g>
    </g>
    <text x="100" y="264" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#4c4f69" text-anchor="middle" opacity="0.55">no persistent conns</text>
  </g>

  <!-- Arrows → nginx (bundle of lines showing many short conns) -->
  <g stroke="#4c4f69" fill="none" stroke-width="1.5" opacity="0.5">
    <line x1="300" y1="205" x2="445" y2="290"/>
    <line x1="300" y1="235" x2="445" y2="300"/>
    <line x1="300" y1="265" x2="445" y2="310"/>
    <line x1="300" y1="295" x2="445" y2="320"/>
    <line x1="300" y1="325" x2="445" y2="330"/>
  </g>

  <!-- NGINX with keepalive pool -->
  <g transform="translate(450 185)">
    <rect width="310" height="260" rx="12" fill="#fe640b"/>
    <text x="155" y="36" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#fbfaf7" text-anchor="middle" opacity="0.7" letter-spacing="0.12em">NGINX</text>
    <line x1="24" y1="52" x2="286" y2="52" stroke="#fbfaf7" stroke-width="1" opacity="0.25"/>
    <text x="24" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#fbfaf7" font-weight="600">upstream { keepalive 1024; }</text>

    <!-- Visualise the pool: row of slots -->
    <g transform="translate(24 110)">
      <text x="0" y="-4" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#fbfaf7" opacity="0.7" letter-spacing="0.1em">POOL (1024 SLOTS)</text>
      <g fill="#fbfaf7">
        <rect x="0"  y="8" width="22" height="22" rx="3"/>
        <rect x="28" y="8" width="22" height="22" rx="3"/>
        <rect x="56" y="8" width="22" height="22" rx="3"/>
        <rect x="84" y="8" width="22" height="22" rx="3"/>
        <rect x="112" y="8" width="22" height="22" rx="3"/>
        <rect x="140" y="8" width="22" height="22" rx="3"/>
        <rect x="168" y="8" width="22" height="22" rx="3"/>
        <rect x="196" y="8" width="22" height="22" rx="3"/>
        <rect x="224" y="8" width="22" height="22" rx="3"/>
      </g>
      <text x="254" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#fbfaf7" opacity="0.85">…</text>
    </g>

    <text x="24" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#fbfaf7" opacity="0.9">proxy_http_version 1.1;</text>
    <text x="24" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#fbfaf7" opacity="0.9">proxy_set_header Connection "";</text>
    <text x="24" y="234" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#fbfaf7" opacity="0.7">reuses connections to upstream</text>
  </g>

  <!-- Single persistent pipe to remote -->
  <g stroke="#4c4f69" fill="#4c4f69" stroke-width="5" opacity="0.85">
    <line x1="760" y1="315" x2="900" y2="315"/>
  </g>
  <text x="830" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#4c4f69" text-anchor="middle" opacity="0.8" font-weight="600">persistent</text>
  <text x="830" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#4c4f69" text-anchor="middle" opacity="0.55">HTTP/1.1 + keep-alive</text>

  <!-- Remote webservice -->
  <g transform="translate(910 255)">
    <rect width="200" height="120" rx="12" stroke="#4c4f69" stroke-width="3"/>
    <text x="100" y="30" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#4c4f69" text-anchor="middle" opacity="0.55" letter-spacing="0.12em">REMOTE</text>
    <text x="100" y="62" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#4c4f69" text-anchor="middle" font-weight="600">webservice</text>
    <text x="100" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#4c4f69" text-anchor="middle" opacity="0.55">(TLS, far away)</text>
  </g>

  <text x="1178" y="618" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#4c4f69" text-anchor="end" opacity="0.35">// syshero.org</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"
     fill="none" role="img"
     aria-label="A transparent agent sits between a chat client and the upstream model: client on the left, transparent agent in the middle, model on the right">
  <rect width="1200" height="630" fill="#fbfaf7"/>

  <defs>
    <marker id="ink-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4c4f69"/>
    </marker>
  </defs>

  <!-- Terminal chrome -->
  <g>
    <rect x="0" y="0" width="1200" height="36" fill="#eeeae3"/>
    <circle cx="18" cy="18" r="5.5" fill="#ff5f56"/>
    <circle cx="36" cy="18" r="5.5" fill="#ffbd2e"/>
    <circle cx="54" cy="18" r="5.5" fill="#27c93f"/>
    <line x1="0" y1="36" x2="1200" y2="36" stroke="#4c4f69" stroke-width="0.5" opacity="0.12"/>
  </g>

  <!-- CLIENT (left, outline ink) -->
  <g transform="translate(80 245)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect width="200" height="140" rx="10" stroke="#4c4f69" stroke-width="3"/>
    <text x="100" y="56" font-size="18" fill="#4c4f69" text-anchor="middle">Open WebUI</text>
    <text x="100" y="86" font-size="16" fill="#4c4f69" text-anchor="middle" opacity="0.65">curl</text>
    <text x="100" y="112" font-size="16" fill="#4c4f69" text-anchor="middle" opacity="0.65">n8n</text>
  </g>
  <text x="180" y="430" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#4c4f69"
        text-anchor="middle" opacity="0.55" letter-spacing="0.10em">CHAT CLIENT</text>

  <!-- Arrow CLIENT → AGENT -->
  <line x1="290" y1="315" x2="430" y2="315" stroke="#4c4f69" stroke-width="3"
        marker-end="url(#ink-arrow)"/>

  <!-- TRANSPARENT AGENT (centre, solid peach) -->
  <g transform="translate(440 225)">
    <rect width="340" height="180" rx="12" fill="#fe640b"/>
    <text x="170" y="86" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="600"
          fill="#fbfaf7" text-anchor="middle">transparent</text>
    <text x="170" y="130" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="600"
          fill="#fbfaf7" text-anchor="middle">agent</text>
  </g>

  <!-- Arrow AGENT → MODEL -->
  <line x1="790" y1="315" x2="910" y2="315" stroke="#4c4f69" stroke-width="3"
        marker-end="url(#ink-arrow)"/>

  <!-- MODEL (right, outline ink) -->
  <g transform="translate(920 245)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect width="200" height="140" rx="10" stroke="#4c4f69" stroke-width="3"/>
    <text x="100" y="56" font-size="18" fill="#4c4f69" text-anchor="middle">gpt-oss-120b</text>
    <text x="100" y="86" font-size="16" fill="#4c4f69" text-anchor="middle" opacity="0.65">Claude</text>
    <text x="100" y="112" font-size="16" fill="#4c4f69" text-anchor="middle" opacity="0.65">any chat model</text>
  </g>
  <text x="1020" y="430" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#4c4f69"
        text-anchor="middle" opacity="0.55" letter-spacing="0.10em">UPSTREAM MODEL</text>

  <!-- Corner wordmark -->
  <text x="1178" y="618" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="11" fill="#4c4f69" text-anchor="end" opacity="0.35">// syshero.org</text>
</svg>

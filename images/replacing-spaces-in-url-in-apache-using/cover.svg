<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none" role="img" aria-label="Apache mod_rewrite replace spaces with dashes using the [N] flag to avoid infinite loops">
  <rect width="1200" height="630" fill="#fbfaf7"/>

  <g>
    <rect x="0" y="0" width="1200" height="36" fill="#eeeae3"/>
    <circle cx="18" cy="18" r="5.5" fill="#ff5f56"/>
    <circle cx="36" cy="18" r="5.5" fill="#ffbd2e"/>
    <circle cx="54" cy="18" r="5.5" fill="#27c93f"/>
    <line x1="0" y1="36" x2="1200" y2="36" stroke="#4c4f69" stroke-width="0.5" opacity="0.12"/>
  </g>

  <!-- Input URL -->
  <g transform="translate(80 210)">
    <rect width="300" height="60" rx="10" stroke="#4c4f69" stroke-width="2.5"/>
    <text x="150" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#4c4f69" text-anchor="middle">/my<tspan fill="#fe640b" font-weight="600"> </tspan>page<tspan fill="#fe640b" font-weight="600"> </tspan>path</text>
  </g>
  <text x="230" y="295" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#4c4f69" text-anchor="middle" opacity="0.55" letter-spacing="0.1em">INPUT URL</text>

  <!-- Arrow -->
  <g stroke="#4c4f69" fill="#4c4f69" stroke-width="2.5">
    <line x1="385" y1="240" x2="445" y2="240"/>
    <polygon points="455,240 443,233 443,247"/>
  </g>

  <!-- RewriteRule box (peach) — this is the protagonist -->
  <g transform="translate(450 175)">
    <rect width="320" height="140" rx="12" fill="#fe640b"/>
    <text x="160" y="34" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#fbfaf7" text-anchor="middle" opacity="0.7" letter-spacing="0.12em">REWRITERULE</text>
    <line x1="24" y1="52" x2="296" y2="52" stroke="#fbfaf7" stroke-width="1" opacity="0.25"/>
    <text x="24" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#fbfaf7">^([^\s]*)\s(.*)$</text>
    <text x="24" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#fbfaf7">  → $1-$2</text>
    <text x="24" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#fbfaf7" font-weight="600">[R=301, N, DPI]</text>
  </g>

  <!-- Loop-back arrow showing the [N] flag re-applies the rule -->
  <g stroke="#fbfaf7" fill="none" stroke-width="2" stroke-dasharray="4 3">
    <path d="M 770 175 Q 860 175 860 245 Q 860 315 770 315" fill="none"/>
  </g>
  <text x="870" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#4c4f69" opacity="0.8" font-weight="600">[N] loop</text>
  <text x="870" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#4c4f69" opacity="0.55">re-apply until no</text>
  <text x="870" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#4c4f69" opacity="0.55">spaces remain</text>

  <!-- Arrow down to output -->
  <g stroke="#4c4f69" fill="#4c4f69" stroke-width="2.5">
    <line x1="610" y1="330" x2="610" y2="400"/>
    <polygon points="610,410 603,398 617,398"/>
  </g>

  <!-- Output URL -->
  <g transform="translate(460 420)">
    <rect width="300" height="60" rx="10" fill="#40a02b" opacity="0.15"/>
    <rect width="300" height="60" rx="10" stroke="#40a02b" stroke-width="2.5"/>
    <text x="150" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#40a02b" text-anchor="middle" font-weight="600">/my-page-path</text>
  </g>
  <text x="610" y="505" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#40a02b" text-anchor="middle" opacity="0.7" letter-spacing="0.1em" stroke="#fbfaf7" stroke-width="4" paint-order="stroke">301 REDIRECT</text>

  <!-- Side note about DPI -->
  <g transform="translate(820 420)">
    <rect width="320" height="85" rx="8" stroke="#4c4f69" stroke-width="1.5" opacity="0.3"/>
    <text x="16" y="26" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#4c4f69" opacity="0.7" letter-spacing="0.08em">FLAG LEGEND</text>
    <text x="16" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#4c4f69" opacity="0.75">N   = next iteration</text>
    <text x="16" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#4c4f69" opacity="0.75">DPI = discard path info</text>
  </g>

  <text x="1178" y="618" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#4c4f69" text-anchor="end" opacity="0.35">// syshero.org</text>
</svg>

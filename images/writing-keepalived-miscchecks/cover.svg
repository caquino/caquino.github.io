<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none" role="img" aria-label="Keepalived MISC_CHECK: custom health script with exit-code routing">
  <rect width="1200" height="630" fill="#fbfaf7"/>

  <g>
    <rect x="0" y="0" width="1200" height="36" fill="#eeeae3"/>
    <circle cx="18" cy="18" r="5.5" fill="#ff5f56"/>
    <circle cx="36" cy="18" r="5.5" fill="#ffbd2e"/>
    <circle cx="54" cy="18" r="5.5" fill="#27c93f"/>
    <line x1="0" y1="36" x2="1200" y2="36" stroke="#4c4f69" stroke-width="0.5" opacity="0.12"/>
  </g>

  <!-- Keepalived on the left -->
  <g transform="translate(110 235)">
    <rect width="230" height="160" rx="12" stroke="#4c4f69" stroke-width="3"/>
    <text x="115" y="38" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#4c4f69" text-anchor="middle" font-weight="600">Keepalived</text>
    <line x1="24" y1="54" x2="206" y2="54" stroke="#4c4f69" stroke-width="1" opacity="0.18"/>
    <text x="115" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#4c4f69" text-anchor="middle" opacity="0.7">MISC_CHECK {</text>
    <text x="115" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#4c4f69" text-anchor="middle" opacity="0.7">  misc_path …</text>
    <text x="115" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#4c4f69" text-anchor="middle" opacity="0.7">}</text>
  </g>
  <text x="225" y="415" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#4c4f69" text-anchor="middle" opacity="0.55">delay_loop 5</text>

  <!-- Spawn arrow with clock icon -->
  <g stroke="#4c4f69" fill="#4c4f69" stroke-width="2.5">
    <line x1="340" y1="315" x2="440" y2="315"/>
    <polygon points="450,315 438,308 438,322"/>
  </g>
  <text x="390" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#4c4f69" text-anchor="middle" opacity="0.55">fork/exec</text>

  <!-- Check script (peach) -->
  <g transform="translate(460 235)">
    <rect width="260" height="160" rx="12" fill="#fe640b"/>
    <text x="130" y="38" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#fbfaf7" text-anchor="middle" opacity="0.7" letter-spacing="0.12em">CHECK SCRIPT</text>
    <line x1="24" y1="54" x2="236" y2="54" stroke="#fbfaf7" stroke-width="1" opacity="0.25"/>
    <text x="24" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#fbfaf7" opacity="0.9">check_mssql_mirror.py</text>
    <text x="24" y="106" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#fbfaf7" opacity="0.75"># query PRINCIPAL state</text>
    <text x="24" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#fbfaf7">exit 0 | exit 1</text>
  </g>

  <!-- Branches: exit 0 → UP (green), exit 1 → DOWN (blue, removed) -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <!-- exit 0 → UP -->
    <g stroke="#40a02b" fill="#40a02b" stroke-width="2.5">
      <line x1="720" y1="275" x2="840" y2="220"/>
      <polygon points="846,217 836,224 833,210"/>
    </g>
    <text x="780" y="245" font-size="14" fill="#40a02b" font-weight="600" stroke="#fbfaf7" stroke-width="4" paint-order="stroke">exit 0</text>
    <g transform="translate(850 190)">
      <rect width="220" height="62" rx="10" fill="#40a02b"/>
      <text x="110" y="28" font-size="14" fill="#fbfaf7" text-anchor="middle" opacity="0.85">real_server</text>
      <text x="110" y="50" font-size="16" fill="#fbfaf7" text-anchor="middle" font-weight="600">keep in pool</text>
    </g>

    <!-- exit 1 → DOWN -->
    <g stroke="#1e66f5" fill="#1e66f5" stroke-width="2.5">
      <line x1="720" y1="355" x2="840" y2="410"/>
      <polygon points="846,413 833,420 836,406"/>
    </g>
    <text x="780" y="395" font-size="14" fill="#1e66f5" font-weight="600" stroke="#fbfaf7" stroke-width="4" paint-order="stroke">exit 1</text>
    <g transform="translate(850 380)">
      <rect width="220" height="62" rx="10" stroke="#1e66f5" stroke-width="2.5"/>
      <text x="110" y="28" font-size="14" fill="#1e66f5" text-anchor="middle" opacity="0.85">real_server</text>
      <text x="110" y="50" font-size="16" fill="#1e66f5" text-anchor="middle" font-weight="600">remove from pool</text>
    </g>
  </g>

  <text x="1178" y="618" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#4c4f69" text-anchor="end" opacity="0.35">// syshero.org</text>
</svg>

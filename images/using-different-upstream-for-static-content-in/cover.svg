<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none" role="img" aria-label="NGINX routes static and dynamic content to separate upstreams with different load-balancing">
  <rect width="1200" height="630" fill="#fbfaf7"/>

  <g>
    <rect x="0" y="0" width="1200" height="36" fill="#eeeae3"/>
    <circle cx="18" cy="18" r="5.5" fill="#ff5f56"/>
    <circle cx="36" cy="18" r="5.5" fill="#ffbd2e"/>
    <circle cx="54" cy="18" r="5.5" fill="#27c93f"/>
    <line x1="0" y1="36" x2="1200" y2="36" stroke="#4c4f69" stroke-width="0.5" opacity="0.12"/>
  </g>

  <!-- Incoming request -->
  <g transform="translate(80 275)">
    <rect width="160" height="70" rx="10" stroke="#4c4f69" stroke-width="2.5"/>
    <text x="80" y="32" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#4c4f69" text-anchor="middle" opacity="0.6">request</text>
    <text x="80" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#4c4f69" text-anchor="middle">GET /…</text>
  </g>

  <!-- Location regex test (peach diamond-ish) -->
  <g transform="translate(290 240)">
    <rect width="290" height="140" rx="12" fill="#fe640b"/>
    <text x="145" y="34" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#fbfaf7" text-anchor="middle" opacity="0.7" letter-spacing="0.12em">LOCATION REGEX</text>
    <line x1="24" y1="50" x2="266" y2="50" stroke="#fbfaf7" stroke-width="1" opacity="0.25"/>
    <text x="145" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#fbfaf7" text-anchor="middle">~* \.(css|js|png|jpg|</text>
    <text x="145" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#fbfaf7" text-anchor="middle">       gif|ico|html?)$</text>
    <text x="145" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#fbfaf7" text-anchor="middle" opacity="0.75">match → static | else → dynamic</text>
  </g>

  <!-- Arrow in -->
  <g stroke="#4c4f69" fill="#4c4f69" stroke-width="2.5">
    <line x1="245" y1="310" x2="285" y2="310"/>
    <polygon points="295,310 283,303 283,317"/>
  </g>

  <!-- Branch: match → static upstream (top) -->
  <g stroke="#4c4f69" fill="#4c4f69" stroke-width="2.5">
    <line x1="580" y1="270" x2="680" y2="200"/>
    <polygon points="686,196 676,203 673,189"/>
  </g>
  <text x="625" y="225" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#4c4f69" opacity="0.75">match</text>

  <!-- Static upstream -->
  <g transform="translate(695 155)">
    <rect width="410" height="120" rx="12" stroke="#4c4f69" stroke-width="2.5"/>
    <text x="20" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#4c4f69" font-weight="600">upstream staticcontent</text>
    <text x="20" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#4c4f69" opacity="0.6">(no ip_hash, round-robin)</text>
    <!-- small backend icons -->
    <g fill="#4c4f69" opacity="0.4">
      <rect x="20" y="70" width="80" height="28" rx="4"/>
      <rect x="108" y="70" width="80" height="28" rx="4"/>
      <rect x="196" y="70" width="80" height="28" rx="4"/>
      <rect x="284" y="70" width="80" height="28" rx="4"/>
    </g>
    <text x="60" y="89" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#fbfaf7" text-anchor="middle">be-01</text>
    <text x="148" y="89" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#fbfaf7" text-anchor="middle">be-02</text>
    <text x="236" y="89" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#fbfaf7" text-anchor="middle">be-03</text>
    <text x="324" y="89" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#fbfaf7" text-anchor="middle">be-04</text>
  </g>

  <!-- Branch: else → dynamic upstream (bottom) -->
  <g stroke="#4c4f69" fill="#4c4f69" stroke-width="2.5">
    <line x1="580" y1="355" x2="680" y2="425"/>
    <polygon points="686,429 673,436 676,422"/>
  </g>
  <text x="625" y="410" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#4c4f69" opacity="0.75">else</text>

  <!-- Dynamic upstream -->
  <g transform="translate(695 395)">
    <rect width="410" height="120" rx="12" stroke="#1e66f5" stroke-width="2.5"/>
    <text x="20" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#1e66f5" font-weight="600">upstream dynamiccontent</text>
    <text x="20" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#1e66f5" opacity="0.8">ip_hash (sticky sessions)</text>
    <g fill="#1e66f5" opacity="0.55">
      <rect x="20" y="70" width="80" height="28" rx="4"/>
      <rect x="108" y="70" width="80" height="28" rx="4"/>
      <rect x="196" y="70" width="80" height="28" rx="4"/>
      <rect x="284" y="70" width="80" height="28" rx="4"/>
    </g>
    <text x="60" y="89" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#fbfaf7" text-anchor="middle">be-01</text>
    <text x="148" y="89" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#fbfaf7" text-anchor="middle">be-02</text>
    <text x="236" y="89" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#fbfaf7" text-anchor="middle">be-03</text>
    <text x="324" y="89" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#fbfaf7" text-anchor="middle">be-04</text>
  </g>

  <text x="1178" y="618" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#4c4f69" text-anchor="end" opacity="0.35">// syshero.org</text>
</svg>

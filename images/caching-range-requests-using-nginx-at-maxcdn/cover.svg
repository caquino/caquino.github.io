<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none" role="img" aria-label="Ranger normalises byte-range requests into fixed-size slices so NGINX can cache partial content">
  <rect width="1200" height="630" fill="#fbfaf7"/>

  <g>
    <rect x="0" y="0" width="1200" height="36" fill="#eeeae3"/>
    <circle cx="18" cy="18" r="5.5" fill="#ff5f56"/>
    <circle cx="36" cy="18" r="5.5" fill="#ffbd2e"/>
    <circle cx="54" cy="18" r="5.5" fill="#27c93f"/>
    <line x1="0" y1="36" x2="1200" y2="36" stroke="#4c4f69" stroke-width="0.5" opacity="0.12"/>
  </g>

  <!-- Client with Range header -->
  <g transform="translate(70 220)">
    <rect width="230" height="110" rx="10" stroke="#4c4f69" stroke-width="2.5"/>
    <text x="115" y="30" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#4c4f69" text-anchor="middle" opacity="0.55" letter-spacing="0.1em">CLIENT</text>
    <text x="20" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#4c4f69">GET /video.mp4</text>
    <rect x="14" y="72" width="202" height="28" rx="4" fill="#fe640b" opacity="0.18"/>
    <text x="24" y="91" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#4c4f69" font-weight="600">Range: bytes=512-900</text>
  </g>

  <!-- Arrow → ranger -->
  <g stroke="#4c4f69" fill="#4c4f69" stroke-width="2.5">
    <line x1="305" y1="275" x2="365" y2="275"/>
    <polygon points="375,275 363,268 363,282"/>
  </g>

  <!-- ranger Lua middleware (peach) -->
  <g transform="translate(380 195)">
    <rect width="310" height="160" rx="12" fill="#fe640b"/>
    <text x="155" y="34" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#fbfaf7" text-anchor="middle" opacity="0.7" letter-spacing="0.12em">RANGER (LUA)</text>
    <line x1="24" y1="50" x2="286" y2="50" stroke="#fbfaf7" stroke-width="1" opacity="0.25"/>
    <text x="24" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#fbfaf7" opacity="0.95">split into fixed blocks</text>
    <text x="24" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#fbfaf7" opacity="0.95">fetch each block via cache</text>
    <text x="24" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#fbfaf7" opacity="0.95">re-assemble → 206 Partial</text>
    <text x="24" y="144" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#fbfaf7" opacity="0.7">normalises variable ranges → uniform keys</text>
  </g>

  <!-- Arrow → cache blocks -->
  <g stroke="#4c4f69" fill="#4c4f69" stroke-width="2.5">
    <line x1="695" y1="275" x2="760" y2="275"/>
    <polygon points="770,275 758,268 758,282"/>
  </g>

  <!-- Cache block grid on right -->
  <g transform="translate(780 175)">
    <text x="160" y="20" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#4c4f69" text-anchor="middle" opacity="0.55" letter-spacing="0.12em">CACHE BLOCKS</text>
    <!-- 8 slots showing HIT/MISS pattern -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
      <g transform="translate(0 35)">
        <rect width="76" height="48" rx="5" fill="#40a02b"/>
        <text x="38" y="20" fill="#fbfaf7" text-anchor="middle">0–511</text>
        <text x="38" y="38" fill="#fbfaf7" text-anchor="middle" font-weight="600">HIT</text>
      </g>
      <g transform="translate(84 35)">
        <rect width="76" height="48" rx="5" fill="#fe640b"/>
        <text x="38" y="20" fill="#fbfaf7" text-anchor="middle">512–1023</text>
        <text x="38" y="38" fill="#fbfaf7" text-anchor="middle" font-weight="600">MISS</text>
      </g>
      <g transform="translate(168 35)">
        <rect width="76" height="48" rx="5" fill="#40a02b"/>
        <text x="38" y="20" fill="#fbfaf7" text-anchor="middle">1024–1535</text>
        <text x="38" y="38" fill="#fbfaf7" text-anchor="middle" font-weight="600">HIT</text>
      </g>
      <g transform="translate(252 35)">
        <rect width="76" height="48" rx="5" fill="#40a02b"/>
        <text x="38" y="20" fill="#fbfaf7" text-anchor="middle">1536–2047</text>
        <text x="38" y="38" fill="#fbfaf7" text-anchor="middle" font-weight="600">HIT</text>
      </g>
      <g transform="translate(0 95)">
        <rect width="76" height="48" rx="5" fill="#fe640b"/>
        <text x="38" y="20" fill="#fbfaf7" text-anchor="middle">2048–2559</text>
        <text x="38" y="38" fill="#fbfaf7" text-anchor="middle" font-weight="600">MISS</text>
      </g>
      <g transform="translate(84 95)">
        <rect width="76" height="48" rx="5" fill="#40a02b"/>
        <text x="38" y="20" fill="#fbfaf7" text-anchor="middle">2560–3071</text>
        <text x="38" y="38" fill="#fbfaf7" text-anchor="middle" font-weight="600">HIT</text>
      </g>
      <g transform="translate(168 95)">
        <rect width="76" height="48" rx="5" fill="#40a02b"/>
        <text x="38" y="20" fill="#fbfaf7" text-anchor="middle">3072–3583</text>
        <text x="38" y="38" fill="#fbfaf7" text-anchor="middle" font-weight="600">HIT</text>
      </g>
      <g transform="translate(252 95)">
        <rect width="76" height="48" rx="5" fill="#4c4f69" opacity="0.35"/>
        <text x="38" y="20" fill="#fbfaf7" text-anchor="middle">3584–…</text>
        <text x="38" y="38" fill="#fbfaf7" text-anchor="middle">…</text>
      </g>
    </g>
  </g>

  <!-- Legend at bottom -->
  <g transform="translate(760 365)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#4c4f69">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#40a02b"/>
    <text x="22" y="11" opacity="0.75">cache hit</text>
    <rect x="130" y="0" width="14" height="14" rx="3" fill="#fe640b"/>
    <text x="152" y="11" opacity="0.75">fetched from origin</text>
  </g>

  <text x="1178" y="618" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#4c4f69" text-anchor="end" opacity="0.35">// syshero.org</text>
</svg>

name: Deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - id: pages
        uses: actions/configure-pages@v6

      - name: Install Pagefind
        run: |
          curl -sSL -o /tmp/pf.tar.gz \
            "https://github.com/CloudCannon/pagefind/releases/download/v1.5.2/pagefind-v1.5.2-x86_64-unknown-linux-musl.tar.gz"
          sudo tar -xzf /tmp/pf.tar.gz -C /usr/local/bin
          pagefind --version

      - name: Render PNG cover twins for OG cards
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin
          for svg in images/*/cover.svg; do
            dir=$(dirname "$svg")
            rsvg-convert -w 1200 -h 630 "$svg" -o "$dir/cover.png"
          done
          ls -la images/*/cover.png | head -5

      - name: Build Jekyll (plugin runs pagefind post-write)
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

# General Settings
title: "Cassiano Aquino"
name: Cassiano Aquino
job_title: Senior Principal Engineer - DevOps @ Flutter Entertainment Plc
email: cassianoaquino@me.com
description: Protecting the weak against null pointer exceptions, motorcyles, skydiving and technology.
avatar: /images/avatar.jpg
favicon: /images/avatar.jpg
twitter_handler: syshero

# Webmentions — receiver at webmention.io/syshero.org.
# The <link rel="webmention"> in head.html advertises these endpoints so
# Bridgy / Mastodon / dev.to can POST mentions. Per-post reads happen
# client-side via the public JF2 API (no token needed).
webmention_endpoint: https://webmention.io/syshero.org/webmention
webmention_pingback: https://webmention.io/syshero.org/xmlrpc

# GoatCounter analytics — self-hosted in the homelab at analytics.syshero.org.
# /count and /count.js are public; admin dashboards sit behind Authelia.
goatcounter_endpoint: https://analytics.syshero.org

# GitHub repo for "Edit on GitHub" post-footer link (branch + path built below).
github_repo: caquino/caquino.github.io

author:
  name: Cassiano Aquino
  email: cassianoaquino@me.com
  twitter: syshero

# Enabled plugins (Gemfile's :jekyll_plugins group is authoritative; this
# mirror is kept for clarity and so jekyll --safe still loads them).
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-archives
  - jekyll-paginate
  - jekyll-gist

# Social Accounts (only the ones actually used; template can add more later)
social_networks:
  - { name: twitter,   url: 'https://twitter.com/syshero' }
  - { name: mastodon,  url: 'https://mastodon.social/@syshero' }
  - { name: bluesky,   url: 'https://bsky.app/profile/chaosmaker.bsky.social' }
  - { name: linkedin,  url: 'https://linkedin.com/in/cassianoaquino' }
  - { name: github,    url: 'https://github.com/caquino' }

# Modules Settings
show_categories: 0
show_tags: 0
show_email: 0
show_rss: 1
show_comments: 1
show_menu: 1
fixed_sidebar: 1

# Defaults
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      comments: "true"

# Serving
url: "https://syshero.org"
baseurl: ""

# Includes
include: ["_pages"]

# Don't let Jekyll's site cleanup wipe Pagefind's generated index
# between incremental rebuilds in `jekyll serve`.
keep_files: ["pagefind"]

# Outputting
permalink: /:year-:month-:day-:title/
#permalink: /:categories/:title/
category_dir: categories

# jekyll-archives — replaces the old _plugins/{generate_categories,tag_gen}.rb
# generators. Permalinks preserved so existing links keep working.
jekyll-archives:
  enabled:
    - tags
    - categories
  layouts:
    tag: tag_index
    category: category_index
  permalinks:
    tag: '/tag/:name/'
    category: '/categories/:name/'

# Pagination
paginate: 10
paginate_path: "/page:num/"

# Conversion
markdown: kramdown
excerpt_separator: <!--more-->

# Assets Settings
sass:
  sass_dir: assets/partials
  style: compressed

